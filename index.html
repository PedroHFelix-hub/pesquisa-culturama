<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="culturama-favico.png" type="image/png" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="Participe da pesquisa Culturama e conte sobre seus hábitos culturais."
    />
    <title>Pesquisa Culturama</title>
  </head>
  <body>
    <header>
      <img src="imgs/logo-culturama.png" alt="Culturama" />
      <h1>PESQUISA CULTURAMA</h1>
    </header>

    <main>
      <form action="/cadastro" method="get">
        <fieldset>
          <legend>DADOS PESSOAIS</legend>

          <label for="user-name">Nome</label>
          <input
            type="text"
            name="user-name"
            id="user-name"
            autocomplete="name"
            required
          />

          <label for="age">Idade</label>
          <input
            type="number"
            name="age"
            id="age"
            min="12"
            max="100"
            required
          />

          <label for="birthDate">Data de Nascimento</label>
          <input type="date" name="birthDate" id="birthDate" required />

          <label for="email">E-mail</label>
          <input
            type="email"
            name="Email"
            id="email"
            autocomplete="email"
            required
          />

          <label for="tel">Telefone</label>
          <input type="tel" name="tel" id="tel" autocomplete="tel" />

          <label for="profile-pic">Foto de Perfil</label>
          <input type="file" name="profile-pic" id="profile-pic" />
        </fieldset>

    <fieldset> <legend>Perfil</legend>

        

        <fieldset>
          <legend for="gender">GÊNERO</legend>

          <input type="radio" id="man" name="gender" value="man" required />
          <label for="man">Homem</label>

          <input type="radio" id="woman" name="gender" value="woman" />
          <label for="woman">Mulher</label>

          <input type="radio" id="transgender" name="gender" value="transgender"/>
          <label for="transgender">Transgênero</label>
        
          <input type="radio" id="dont-say" name="gender" value="dont-say" />
          <label for="dont-say">Prefiro não dizer</label>
        </fieldset>
          <label for="marital-status">Estado Civil</label>
          <select name="marital-status" id="marital-status" required>
            <option value="" disabled selected>Selecione uma opção...</option>
            <option value="single">Solteiro(a)</option>
            <option value="married">Casado(a)</option>
            <option value="divorced">Divorciado(a)</option>
            <option value="widower">Viúvo(a)</option>
          </select>

          <label for="state">Estado onde você reside: </label>
          <select id="state" name="state">
            <option value="" selected disabled>Selecione seu estado</option>
            <option value="AC">Acre</option>
            <option value="AL">Alagoas</option>
            <option value="AP">Amapá</option>
            <option value="AM">Amazonas</option>
            <option value="BA">Bahia</option>
            <option value="CE">Ceará</option>
            <option value="DF">Distrito Federal</option>
            <option value="ES">Espírito Santo</option>
            <option value="GO">Goiás</option>
            <option value="MA">Maranhão</option>
            <option value="MT">Mato Grosso</option>
            <option value="MS">Mato Grosso do Sul</option>
            <option value="MG">Minas Gerais</option>
            <option value="PA">Pará</option>
            <option value="PB">Paraíba</option>
            <option value="PR">Paraná</option>
            <option value="PE">Pernambuco</option>
            <option value="PI">Piauí</option>
            <option value="RJ">Rio de Janeiro</option>
            <option value="RN">Rio Grande do Norte</option>
            <option value="RS">Rio Grande do Sul</option>
            <option value="RO">Rondônia</option>
            <option value="RR">Roraima</option>
            <option value="SC">Santa Catarina</option>
            <option value="SP">São Paulo</option>
            <option value="SE">Sergipe</option>
            <option value="TO">Tocantins</option>
          </select>

          <label for="city">Cidade</label>
          <input
            type="text"
            id="city"
            name="city"
            placeholder="Digite sua cidade"

          />
        </fieldset>
        <fieldset>
          <legend>HÁBITOS</legend>

          <fieldset>
            <legend>Redes Sociais</legend>
            <input
              type="checkbox"
              name="social-media"
              id="social-x"
              value="x"
            />
            <label for="social-x">X (Twitter)</label>

            <input
              type="checkbox"
              name="social-media"
              id="social-instagram"
              value="instagram"
            />
            <label for="social-instagram">Instagram</label>

            <input
              type="checkbox"
              name="social-media"
              id="social-facebook"
              value="facebook"
            />
            <label for="social-facebook">Facebook</label>

            <input
              type="checkbox"
              name="social-media"
              id="social-tiktok"
              value="tiktok"
            />
            <label for="social-tiktok">TikTok</label>
            </fieldset>
            <label for="style-music">Estilo Musical Favorito</label>
            <input type="text" id="style-music" name="style-music" list="music-genres"
            />
            <datalist id="music-genres">
              <option value="Pop"></option>
              <option value="Rock"></option>
              <option value="Sertanejo"></option>
              <option value="Funk"></option>
              <option value="MPB"></option>
              <option value="Eletrônica"></option>
              <option value="Hip Hop"></option>
              <option value="Forró"></option>
            </datalist>

            <label for="favorite-color">Cor Favorita</label>
            <input type="color" id="favorite-color" name="favorite-color" />
          
        </fieldset>

        <fieldset>
          <legend>QUAL SEU GRAU DE SATISFAÇÃO?</legend>
          <input
            type="radio"
            id="satisfaction-great"
            name="satisfaction"
            value="great-satisfaction"
          />
          <label for="satisfaction-great">Muito satisfeito</label>

          <input
            type="radio"
            id="satisfaction-good"
            name="satisfaction"
            value="good-satisfaction"
          />
          <label for="satisfaction-good">Bem satisfeito</label>

          <input
            type="radio"
            id="satisfaction-regular"
            name="satisfaction"
            value="regular"
          />
          <label for="satisfaction-regular">Ok</label>

          <input
            type="radio"
            id="satisfaction-bad"
            name="satisfaction"
            value="not-satisfaction"
          />
          <label for="satisfaction-bad">Não estou satisfeito</label>
        </fieldset>

        <fieldset>
          <legend>FEEDBACK</legend>
          <label for="feedback">Deixe seu comentário</label>
          <textarea
            name="feedback"
            id="feedback"
            placeholder="Conte pra gente o que achou da experiência..."
          ></textarea>
        </fieldset>

        <fieldset>
          <legend>CONSENTIMENTO</legend>
          <input
            type="checkbox"
            id="lgpd-consent"
            name="lgpd-consent"
            value="accepted"
            required
          />
          <label for="lgpd-consent"
            >Concordo com o tratamento dos meus dados pessoais, conforme a LGPD
            (Lei Geral de Proteção de Dados).</label
          >

          <input
            type="checkbox"
            name="email-results"
            id="email-results"
            value="accepted"
          />
          <label for="email-results"
            >Desejo receber os resultados da pesquisa por e-mail</label
          >
        </fieldset>
        <button type="submit">ENVIAR</button>
        <button type="reset">APAGAR RESPOSTAS</button>
      </form>
    </main>
  </body>
</html>
